stages:
  - build
  - test
  - images
  - extra-test
  - full-test
  - deploy

.build_base: &build_base
  stage: build

  image: ${DLR_REGISTRY}/python:v3.11.12

  before_script:
    - pipx install uv && pipx ensurepath
    - source ~/.bashrc
    - uv sync --group build

  script:
    - uv build --wheel

  artifacts:
    paths:
      - dist
    expire_in: 1 week

.test_base: &test_base
  <<: *build_base

  stage: full-test

  image: ${DLR_REGISTRY}/python:v3.11.12

  before_script:
    - pipx install uv && pipx ensurepath
    - source ~/.bashrc
    - uv venv
    - apt-get update && apt-get install -y pandoc
    - uv sync --all-extras --group docs --group dev --group test

# Template for extra jobs that install from wheel with extras
.extra_install_base: &extra_install_base

  stage: extra-test

  before_script:
    - pipx install uv && pipx ensurepath
    - source ~/.bashrc
    - uv venv
    - WHEEL="$(ls dist)"

  artifacts:
    paths:
      - dist

  needs:
    - job: wheel
    
wheel:
  <<: *build_base

sdist:
  <<: *build_base

test:
  <<: *test_base

  # regex to grep coverage
  coverage: '/TOTAL.* (\d{1,3}%)/'

  script:
    - uv run pytest src/tests --cov=tasi --cov-report=html:coverage

  artifacts:
    paths:
      # save the coverage results to create html results in the next stage
      - coverage

  needs:
    - job: wheel
    - job: sdist


.extra_base: &extra_base

  stage: extra-test

  before_script:
    - pipx install uv && pipx ensurepath
    - source ~/.bashrc
    - uv venv
    - WHEEL="$(ls dist)"
    - SUFFIX="${CI_JOB_NAME#extra-}"
    - uv pip install dist/${WHEEL}[${SUFFIX}]

  artifacts:
    paths:
      - dist

  needs:
    - job: wheel


extra-io:
  <<: *extra_base

  script:
    - uv run python -c "from tasi.io import *"

extra-visualization:
  <<: *extra_base

  script:
    - uv run python -c "from tasi.plotting import *"

extra-wms:
  <<: *extra_install_base

  script:
    - uv pip install dist/${WHEEL}[wms]
    - uv run python -c "from tasi.plotting.wms import *"

extra-geo:
  <<: *extra_install_base

  script:
    - uv pip install dist/${WHEEL}[io,geo]
    - uv run python -c "from tasi.io.geo import *"

extra-osi:
  <<: *extra_install_base

  script:
    - uv pip install dist/${WHEEL}[io,osi]
    - uv run python -c "from tasi.io.osi import *"



doc:
  <<: *test_base

  script:
    - uv run python -c "import tilemapbase; tilemapbase.init(create=True);"
    - SPHINXOPTS="-j 8" uv run make -C doc html
    # move the HTML doc to the local directory
    - mv doc/build/html ./html

  artifacts:
    paths:
      - html
    expire_in: 1 week

  needs:
    - job: wheel
    - job: sdist

pages:
  stage: deploy

  script:
    # rename the documentation to public
    - mv html public/
    # move the html coverage results into the documentation page
    - mv coverage public/coverage

  only:
    - master
    - tags

  artifacts:
    paths:
      - public # All relevant content needs to be available here

  needs:
    - job: test
      artifacts: true
    - job: doc
      artifacts: true
